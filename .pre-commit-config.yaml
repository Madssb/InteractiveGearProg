repos:
  - repo: local
    hooks:
      - id: generate-milestone-metadata
        name: Generate milestone metadata
        entry: uv run --project tools python tools/generate_milestone_metadata.py
        language: system
        files: ^data/logic/(milestone-sequence-main|milestone-sequence-retirement|filter)\.json$
        pass_filenames: false
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.5
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [--fix]
      # Run the formatter.
      - id: ruff-format
