name: Validate milestone metadata

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: milestone-metadata-validation
  cancel-in-progress: false

jobs:
  metadata-consistency:
    name: Generated metadata is current
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Check all milestone resolve to icon assets
        run: cd tools && uv run asset_cli.py check-assets

      - name: Check set of milestones is subset of metadata keys
        run: cd tools && uv run asset_cli.py check-metadata
