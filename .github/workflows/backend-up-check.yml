name: Backend Up Check

on:
  schedule:
    - cron: "22 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run healthcheck
        run: curl --fail api.ladlorchart.com/health
